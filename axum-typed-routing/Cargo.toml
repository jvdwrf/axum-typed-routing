[package]
name = "axum-typed-routing"
version = "0.4.7"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["axum", "routing", "handler", "typed", "macro"]
categories = ["web-programming"]
description = "Typed routing macros for axum"
homepage = "https://github.com/jvdwrf/axum-typed-routing"
repository = "https://github.com/jvdwrf/axum-typed-routing"
readme = "../README.md"

[package.metadata.docs.rs]
features = ["aide"]

[dependencies]
axum.workspace = true
aide = { workspace = true, optional = true }
axum-typed-routing-macros = { version = "0.3.7", path = "../axum-typed-routing-macros" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum-test = { version = "21", features = [] }
serde.workspace = true
schemars.workspace = true
aide.workspace = true
axum = { workspace = true, features = ["macros"]}
serde_json = "1"

[features]
aide = ["dep:aide"]

[[example]]
name = "aide"
required-features = ["aide"]
